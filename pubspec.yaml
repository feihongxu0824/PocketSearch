name: pocketsearch
description: "On-device semantic photo search powered by zvec + MobileCLIP"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # On-device vector database
  zvec: ^0.4.0

  # MNN inference engine (Dart FFI)
  mnn: ^0.1.3

  # System photo gallery access
  photo_manager: ^3.6.0

  # File path utilities
  path_provider: ^2.1.0
  path: ^1.9.0

  # Permissions
  permission_handler: ^11.3.0

  # UI
  cupertino_icons: ^1.0.8
  share_plus: ^13.1.0

  # Settings persistence (LLM rewriter config: enabled / base url / api key / model)
  shared_preferences: ^2.3.0

  # HTTP client used by the optional OpenAI-compatible LLM query rewriter
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/mobileclip_s1_image_encoder.mnn
    - assets/models/mobileclip_s1_text_encoder.mnn
    - assets/tokenizer/
    - assets/test_images/
    - assets/test_images/real/
